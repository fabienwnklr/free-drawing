name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # as the release workflow (node:sqlite of the server without flag)
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      # yarn workspaces (packages/*, apps/*), yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile

      # library, plugin template, plugin generator, server and web app
      - name: Type check
        run: yarn typecheck

      # ESLint and Prettier
      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # library (npm package) and web app (static site)
      - name: Build
        run: yarn build && yarn build:static
