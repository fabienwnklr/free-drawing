name: Release

# GitHub release of a version tag (vX.Y.Z), notes from its entry of the library changelog, then the library
# published on npm (trusted publishing: no token, configured on npmjs.com for this workflow file, allowing `npm publish`),
# and the packages with their own version (plugin generator, React and Vue components) not published yet.
# A push of more than 3 tags at once triggers no workflow: run it from the Actions tab with the tag,
# or with "all" for every tag of the changelog without release (oldest first, nothing published).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the version (e.g. v7.9.2), or "all" for every tag without release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # tag of the release, branch (whole changelog) for "all"
          ref: ${{ inputs.tag != 'all' && inputs.tag || github.ref }}
          # tags for "all"
          fetch-depth: 0

      - name: Create or update releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          changelog=packages/free-drawing/CHANGELOG.md

          # entry of a version: lines after its title, until the title of the previous version,
          # then link of its title comparing previous tag with this one
          notes() {
            awk -v version="${1#v}" '
              /^## / {
                if (found) exit
                found = index($0, "[" version "]") > 0
                if (found && match($0, /\(https:[^)]*\)/)) link = substr($0, RSTART + 1, RLENGTH - 2)
                next
              }
              found
              END { if (link) printf "\n**Full Changelog**: %s\n", link }
            ' "$changelog"
          }

          # release of a tag, created or updated, "Latest" when true is given
          release() {
            notes "$1" > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::No entry for $1 in $changelog"
              return 1
            fi
            if gh release view "$1" > /dev/null 2>&1; then
              gh release edit "$1" --notes-file notes.md
            else
              gh release create "$1" --title "$1" --notes-file notes.md --verify-tag --latest="$2"
            fi
          }

          # highest version: the only "Latest" one (an older tag released later is not)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)

          if [ "$TAG" != all ]; then
            release "$TAG" "$([ "$TAG" = "$latest" ] && echo true || echo false)"
            exit
          fi

          # missing releases of versions in changelog, oldest first
          for tag in $(git tag -l 'v*' --sort=v:refname); do
            if grep -q "^## \[${tag#v}\]" "$changelog" && ! gh release view "$tag" > /dev/null 2>&1; then
              release "$tag" false
            fi
          done
          if gh release view "$latest" > /dev/null 2>&1; then
            gh release edit "$latest" --latest
          fi

  npm:
    needs: release
    # one version at a time
    if: inputs.tag != 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # identity of this workflow for npm (trusted publishing, provenance)
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # npm 11.5.1 or later for trusted publishing. No registry-url: its placeholder token would be used when
      # trusted publishing fails, with a misleading 404 instead of an authentication error
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Check version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: packages/free-drawing
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG is not the version of package.json ($version)"
            exit 1
          fi
          # an older version would become the "latest" one of npm
          if [ "$TAG" != "$(git tag -l 'v*' --sort=-v:refname | head -1)" ]; then
            echo "::notice::$TAG is not the highest version: not published"
          elif npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.publish
        run: yarn install --frozen-lockfile

      - name: Test and build
        if: steps.version.outputs.publish
        run: yarn test && yarn build

      - name: Publish
        if: steps.version.outputs.publish
        working-directory: packages/free-drawing
        run: |
          # status of npm, not of tee (default shell: bash -e, without pipefail)
          set -o pipefail
          echo "npm $(npm --version)"
          if ! npm publish --access public 2>&1 | tee npm-publish.log; then
            # version received from another run (or this one run again) still checked by npm: not visible yet
            if grep -q 'previously staged version' npm-publish.log; then
              echo "::notice::Already published by another run, shown by npm once checked"
              exit 0
            fi
            # what npm receives (claims of the GitHub token, answer of its token exchange), what to change on npmjs.com
            node ../../.github/scripts/npm-oidc-check.mjs "$(node -p "require('./package.json').name")" "$GITHUB_REPOSITORY" ||
              echo "::error::Not published: see the error of npm above"
            exit 1
          fi

  # packages with their own version and changelog (packages/<package>): published with a release of the library once
  # their version is not on npm yet, nor lower than the last published one. The first version of a package is published
  # by hand (its trusted publisher is set on an existing package): nothing is published before. Trusted publisher of each
  # package on npmjs.com: GitHub Actions, this repository, workflow release.yml, no environment, allowing `npm publish`
  npm-packages:
    needs: release
    if: inputs.tag != 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # each package published on its own
      fail-fast: false
      matrix:
        # @fabwcie/create-free-drawing-plugin (`npm create @fabwcie/free-drawing-plugin`), components of React and Vue
        package: [create-plugin, react, vue]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Check version
        id: version
        working-directory: packages/${{ matrix.package }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name" version 2> /dev/null || true)
          if [ -z "$published" ]; then
            echo "::notice::$name is not on npm yet: publish its first version by hand, then set its trusted publisher"
          elif npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already published"
          elif [ "$(printf '%s\n%s\n' "$published" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::notice::$name@$version is lower than $published: not published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.publish
        run: yarn install --frozen-lockfile

      # components: built with the types of the built library
      - name: Test and build
        if: steps.version.outputs.publish
        working-directory: packages/${{ matrix.package }}
        run: |
          yarn test
          if [ "$(node -p "!!require('./package.json').scripts.build")" = true ]; then
            yarn workspace @fabwcie/free-drawing build && yarn build
          fi

      # prepack: template of plugin copied in the package of the generator, components built. Tags pushed together run at
      # once: a package of the same version in both is published by the first run, npm still checks it (not visible yet)
      # when the second one publishes it: 409 "previously staged version", not an error
      - name: Publish
        if: steps.version.outputs.publish
        working-directory: packages/${{ matrix.package }}
        run: |
          # status of npm, not of tee (default shell: bash -e, without pipefail)
          set -o pipefail
          echo "npm $(npm --version)"
          if ! npm publish --access public 2>&1 | tee npm-publish.log; then
            if grep -q 'previously staged version' npm-publish.log; then
              echo "::notice::Already published by another run, shown by npm once checked"
              exit 0
            fi
            node ../../.github/scripts/npm-oidc-check.mjs "$(node -p "require('./package.json').name")" "$GITHUB_REPOSITORY" ||
              echo "::error::Not published: see the error of npm above"
            exit 1
          fi
