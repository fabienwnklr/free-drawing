name: Release

# GitHub release of a version tag (vX.Y.Z), notes from its entry of the library changelog, then the library
# published on npm (trusted publishing: no token, configured on npmjs.com for this workflow file).
# A push of more than 3 tags at once triggers no workflow: run it from the Actions tab with the tag,
# or with "all" for every tag of the changelog without release (oldest first, nothing published).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the version (e.g. v7.9.2), or "all" for every tag without release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # tag of the release, branch (whole changelog) for "all"
          ref: ${{ inputs.tag != 'all' && inputs.tag || github.ref }}
          # tags for "all"
          fetch-depth: 0

      - name: Create or update releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          changelog=packages/free-drawing/CHANGELOG.md

          # entry of a version: lines after its title, until the title of the previous version,
          # then link of its title comparing previous tag with this one
          notes() {
            awk -v version="${1#v}" '
              /^## / {
                if (found) exit
                found = index($0, "[" version "]") > 0
                if (found && match($0, /\(https:[^)]*\)/)) link = substr($0, RSTART + 1, RLENGTH - 2)
                next
              }
              found
              END { if (link) printf "\n**Full Changelog**: %s\n", link }
            ' "$changelog"
          }

          # release of a tag, created or updated, "Latest" when true is given
          release() {
            notes "$1" > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::No entry for $1 in $changelog"
              return 1
            fi
            if gh release view "$1" > /dev/null 2>&1; then
              gh release edit "$1" --notes-file notes.md
            else
              gh release create "$1" --title "$1" --notes-file notes.md --verify-tag --latest="$2"
            fi
          }

          # highest version: the only "Latest" one (an older tag released later is not)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)

          if [ "$TAG" != all ]; then
            release "$TAG" "$([ "$TAG" = "$latest" ] && echo true || echo false)"
            exit
          fi

          # missing releases of versions in changelog, oldest first
          for tag in $(git tag -l 'v*' --sort=v:refname); do
            if grep -q "^## \[${tag#v}\]" "$changelog" && ! gh release view "$tag" > /dev/null 2>&1; then
              release "$tag" false
            fi
          done
          if gh release view "$latest" > /dev/null 2>&1; then
            gh release edit "$latest" --latest
          fi

  npm:
    needs: release
    # one version at a time
    if: inputs.tag != 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # identity of this workflow for npm (trusted publishing, provenance)
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # npm 11.5.1 or later for trusted publishing
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: packages/free-drawing
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG is not the version of package.json ($version)"
            exit 1
          fi
          # an older version would become the "latest" one of npm
          if [ "$TAG" != "$(git tag -l 'v*' --sort=-v:refname | head -1)" ]; then
            echo "::notice::$TAG is not the highest version: not published"
          elif npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.publish
        run: yarn install --frozen-lockfile

      - name: Test and build
        if: steps.version.outputs.publish
        run: yarn test && yarn build

      - name: Publish
        if: steps.version.outputs.publish
        working-directory: packages/free-drawing
        run: npm publish --access public
