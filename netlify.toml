# Docs site (VitePress + API generated by TypeDoc), built by Netlify on each push to master
[build]
  command = "yarn doc:changelog && yarn doc:get-started && yarn doc:typedoc && yarn docs:build"
  publish = "docs/.vitepress/dist"
  # no build when nothing shown by the docs changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs packages/free-drawing/src packages/free-drawing/README.md packages/free-drawing/CHANGELOG.md packages/free-drawing/typedoc.json CONTRIBUTING.md netlify.toml package.json yarn.lock"

[build.environment]
  NODE_VERSION = "22"
