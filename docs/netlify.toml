# Docs site (VitePress + API generated by TypeDoc), built by Netlify on each push to master.
# Its Netlify site has `docs` as package directory (this file): one file per site, none at the root (it would apply
# to every site of the repository).
[build]
  # root of the repository (yarn workspaces, doc scripts), whatever the base directory set in Netlify
  base = "/"
  command = "yarn doc:changelog && yarn doc:get-started && yarn doc:typedoc && yarn docs:build"
  publish = "docs/.vitepress/dist"
  # no build when nothing shown by the docs changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs packages/free-drawing/src packages/free-drawing/README.md packages/free-drawing/CHANGELOG.md packages/free-drawing/typedoc.json packages/free-drawing/typedoc-modules.mjs CONTRIBUTING.md package.json yarn.lock"

[build.environment]
  NODE_VERSION = "22"
